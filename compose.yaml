services:
  haven:
    build: .
    environment:
      HAVEN_APP_URL: ${HAVEN_APP_URL:?Set the HTTPS Haven origin}
      GRAVITAS_ISSUER: ${GRAVITAS_ISSUER:-https://gravitas.cool}
      GRAVITAS_SESSION_KEY: ${GRAVITAS_SESSION_KEY:?Generate a session encryption key}
      HAVEN_STUN_URLS: ${HAVEN_STUN_URLS:-}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - catalog:/data
    restart: unless-stopped
  stun:
    image: coturn/coturn:4.6.3
    profiles: [stun]
    command: ["-n", "--stun-only", "--no-cli", "--no-tls", "--no-dtls", "--log-file=stdout", "--listening-port=3478"]
    ports:
      - "3478:3478/udp"
    restart: unless-stopped
volumes:
  catalog:
