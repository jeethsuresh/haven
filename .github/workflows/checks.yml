name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test -race ./... && go vet ./...
        working-directory: backend
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
        working-directory: client
      - run: dart format --output=none --set-exit-if-changed lib test && flutter analyze && flutter test && flutter build web --release --no-pub
        working-directory: client
